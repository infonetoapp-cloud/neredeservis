services:
  osrm-extract:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["tools"]
    working_dir: /data
    volumes:
      - ./data:/data
    command: ["osrm-extract", "-p", "/opt/car.lua", "/data/region.osm.pbf"]

  osrm-partition:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["tools"]
    working_dir: /data
    volumes:
      - ./data:/data
    command: ["osrm-partition", "/data/region.osrm"]

  osrm-customize:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["tools"]
    working_dir: /data
    volumes:
      - ./data:/data
    command: ["osrm-customize", "/data/region.osrm"]

  osrm-router:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    working_dir: /data
    volumes:
      - ./data:/data
    command: ["osrm-routed", "--algorithm", "mld", "/data/region.osrm"]
    expose:
      - "5000"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - osrm-router
    environment:
      ROUTING_DOMAIN: ${ROUTING_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:

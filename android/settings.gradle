import groovy.json.JsonSlurper

pluginManagement {
    def flutterSdkPath = {
        def fvmSdk = file("../.fvm/flutter_sdk")
        if (fvmSdk.exists()) {
            return fvmSdk.absolutePath
        }

        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "com.android.application" version "8.3.2" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"

def flutterProjectRoot = settingsDir.parentFile
def flutterPluginsFile = new File(flutterProjectRoot, ".flutter-plugins-dependencies")

if (flutterPluginsFile.exists()) {
    def parsed = new JsonSlurper().parseText(flutterPluginsFile.getText("UTF-8"))
    def plugins = parsed instanceof Map ? parsed.plugins : null
    def androidPlugins = plugins instanceof Map ? plugins.android : null

    if (androidPlugins instanceof List) {
        androidPlugins.each { plugin ->
            if (!(plugin instanceof Map)) {
                return
            }

            def needsNativeBuild = plugin.native_build
            if (needsNativeBuild instanceof Boolean && !needsNativeBuild) {
                return
            }

            def pluginName = plugin.name
            def pluginPath = plugin.path
            if (!(pluginName instanceof String) || !(pluginPath instanceof String)) {
                return
            }

            def pluginDirectory = new File(pluginPath, "android")
            if (!pluginDirectory.exists()) {
                return
            }

            include ":${pluginName}"
            project(":${pluginName}").projectDir = pluginDirectory
        }
    }
}
